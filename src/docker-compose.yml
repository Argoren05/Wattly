# Local environment: PostgreSQL + Wattly API.
# Usage (from repository root): cp src/.env.example src/.env && docker compose -f src/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wattly
      POSTGRES_USER: wattly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in src/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattly -d wattly"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Wattly: Host=db;Port=5432;Database=wattly;Username=wattly;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
    ports:
      - "5103:8080"
    volumes:
      - attachments:/data/attachments

volumes:
  pgdata:
  attachments:
