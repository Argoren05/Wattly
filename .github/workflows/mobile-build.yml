# Builds installable mobile apps with EAS Build.
#
# - "preview":    Android APK that can be installed directly on a phone (download link / QR code in the EAS dashboard).
# - "production": Android App Bundle for Google Play and an iOS build for the App Store.
#
# Required repository secret: EXPO_TOKEN (token of an Expo robot user with the Developer role).
# API address and sign-in client IDs come from EAS environment variables (expo.dev → project → Environment
# variables), selected by the `environment` of the build profile in eas.json.
# The EAS project id is stored in src/mobile/app.json; the optional EAS_PROJECT_ID secret overrides it.
name: Mobile build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
  push:
    tags:
      - 'mobile-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Never ship a build that fails the quality gate.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Waits for the cloud build (usually 10–20 min) so the run ends when the installer is ready: the download
      # link lands in the run summary and GitHub's "workflow run" e-mail tells you it is done (see
      # doc/Wattly_Development.md – notifications). The build itself runs on Expo's servers.
      - name: EAS Build
        id: build
        run: >
          eas build
          --profile ${{ github.event.inputs.profile || 'preview' }}
          --platform ${{ github.event.inputs.platform || 'android' }}
          --non-interactive --wait --json > "$RUNNER_TEMP/builds.json"
      - name: Download links in the run summary
        if: always() && steps.build.outcome != 'skipped'
        run: |
          {
            echo "## Instalator Wattly"
            echo
            if [ -s "$RUNNER_TEMP/builds.json" ] && jq -e 'type == "array"' "$RUNNER_TEMP/builds.json" > /dev/null; then
              echo "| Platforma | Wersja | Status | Pobierz | Strona buildu |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.platform) | \(.appVersion // "-") (\(.appBuildVersion // "-")) | \(.status) | \(if .artifacts.buildUrl then "[plik](" + .artifacts.buildUrl + ")" else "-" end) | [expo.dev](https://expo.dev/accounts/\(.project.ownerAccount.name // "argoren")/projects/\(.project.slug // "wattly")/builds/\(.id)) |"' "$RUNNER_TEMP/builds.json"
              echo
              echo "Otwórz link **na telefonie**, pobierz plik APK i zainstaluj go na obecną aplikację – dane zostaną (są na serwerze)."
            else
              echo "Nie udało się odczytać wyniku buildu – sprawdź log kroku *EAS Build* i listę buildów na expo.dev."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
